name: Supabase keep-alive

# Runs on a schedule so the Supabase free-tier project never sees
# 7 days with zero API activity. Every 3 days leaves a big safety
# margin. Times are UTC.
# Each run also updates last-run.txt in this repository, so GitHub
# always sees recent activity and never switches this workflow off.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab, for testing

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/devices?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record last run so GitHub sees activity
        run: |
          date -u > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Keep-alive: record last run"
          git push
