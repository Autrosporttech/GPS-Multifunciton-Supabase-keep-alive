name: Supabase keep-alive

# Runs on a schedule so the Supabase free-tier project never sees
# 7 days with zero API activity. Every 3 days leaves a big safety
# margin. Times are UTC.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/devices?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
